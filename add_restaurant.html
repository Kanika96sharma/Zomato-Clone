<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Restaurant | Zomato Clone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            <img src="images/logo.png" alt="">
        </div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="investor.html">Investor Relations</a></li>
            <li><a href="add_restaurant.html">Add Restaurant</a></li>
            <li><a href="login.html">Log in</a></li>
            <li><a href="signup.html">Sign up</a></li>
        </ul>

    </header>

    <main class="restaurant-page">

        <div class="restaurant-box">

            <h1>Add Your Restaurant 🍽️</h1>

            <p>Partner with Zomato and grow your business.</p>

            <form id="restaurantForm">

                <input type="text" id="restaurantName" placeholder="Restaurant Name" required>

                <input type="text" id="ownerName" placeholder="Owner Name" required>

                <input type="email" id="email" placeholder="Email Address" required>

                <input type="tel" id="phone" placeholder="Phone Number" required>

                <input type="text" id="city" placeholder="City" required>

                <select id="category" required>

                    <option value="">Select Category</option>

                    <option>North Indian</option>

                    <option>South Indian</option>

                    <option>Chinese</option>

                    <option>Italian</option>

                    <option>Fast Food</option>

                    <option>Desserts</option>

                    <option>Cafe</option>

                </select>

                <textarea id="address" placeholder="Restaurant Address" rows="4" required></textarea>

                <button type="submit">
                    Register Restaurant
                </button>

            </form>

        </div>

    </main>

    <footer>

        Copyright &copy; 2026 Zomato Clone | All Rights Reserved

    </footer>

    <script src="script.js"></script>

</body>

</html>
