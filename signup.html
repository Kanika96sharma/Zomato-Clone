<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Zomato Clone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="images/logo.png" alt="">
        </div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="investor.html">Investor Relations</a></li>
            <li><a href="add_restaurant.html">Add Restaurant</a></li>
            <li><a href="login.html">Log in</a></li>
            <li><a href="signup.html">Sign up</a></li>
        </ul>
    </header>

    <main class="signup-page">

        <div class="signup-box">

            <h1>Create Account 🎉</h1>

            <p>Join Zomato and start exploring delicious food.</p>

            <form id="signupForm">

                <input type="text" id="name" placeholder="Full Name" required>

                <input type="email" id="email" placeholder="Email Address" required>

                <input type="tel" id="phone" placeholder="Phone Number" required>

                <input type="password" id="password" placeholder="Password" required>

                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

                <button type="submit">Create Account</button>

            </form>

            <div class="signup-links">
                <a href="login.html">Already have an account? Login</a>
            </div>

        </div>

    </main>

    <footer>
        Copyright &copy; 2026 Zomato Clone | All Rights Reserved
    </footer>

    <script src="script.js"></script>

</body>

</html>
